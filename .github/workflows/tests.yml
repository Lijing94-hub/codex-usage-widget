name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-quality:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Static checks
        run: |
          python -m ruff check codex_usage_widget.py tools/generate_docs_assets.py
          python -m py_compile codex_usage_widget.py tools/generate_docs_assets.py

      - name: Run tests
        run: python codex_usage_widget.py --test --include-ui

      - name: Verify generated screenshots
        shell: pwsh
        run: |
          python tools/generate_docs_assets.py
          git diff --exit-code -- `
            docs/screenshot.png `
            docs/hover-screenshot.png `
            docs/waiting-screenshot.png `
            docs/english-screenshot.png `
            docs/social-preview.png

  windows-package:
    if: github.event_name == 'pull_request'
    needs: windows-quality
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build Windows package
        shell: cmd
        run: build-windows.cmd

      - name: Test packaged application
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "dist\CodexVision\CodexVision.exe" `
            -ArgumentList "--test", "--include-ui" `
            -PassThru
          if (-not $process.WaitForExit(30_000)) {
            Stop-Process -Id $process.Id -Force
            throw "Packaged application self-test timed out."
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged application self-test failed with exit code $($process.ExitCode)."
          }
