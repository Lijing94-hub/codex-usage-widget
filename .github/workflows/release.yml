name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows package
        shell: cmd
        run: build-windows.cmd

      - name: Verify release archive
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\CodexVision-Windows.zip")) {
            throw "Windows release archive was not created."
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist\CodexVision-Windows.zip" `
            --verify-tag `
            --title "Codex Vision ${{ github.ref_name }}" `
            --generate-notes
