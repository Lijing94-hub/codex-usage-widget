name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build Windows package
        shell: cmd
        run: build-windows.cmd

      - name: Verify release archive
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\CodexVision-Windows.zip")) {
            throw "Windows release archive was not created."
          }

      - name: Test packaged application
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "dist\CodexVision\CodexVision.exe" `
            -ArgumentList "--test", "--include-ui" `
            -PassThru
          if (-not $process.WaitForExit(30_000)) {
            Stop-Process -Id $process.Id -Force
            throw "Packaged application self-test timed out."
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged application self-test failed with exit code $($process.ExitCode)."
          }

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\CodexVision-Windows.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  CodexVision-Windows.zip" | Set-Content `
            "dist\CodexVision-Windows.zip.sha256" `
            -Encoding ascii

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist\CodexVision-Windows.zip" `
            "dist\CodexVision-Windows.zip.sha256" `
            --verify-tag `
            --title "Codex Vision ${{ github.ref_name }}" `
            --generate-notes
